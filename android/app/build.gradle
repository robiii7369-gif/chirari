plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.robiii7369.chirari'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.robiii7369.chirari'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1-test'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No extra libraries: the app uses only the Android platform (WebView, TextToSpeech, AppWidget).
