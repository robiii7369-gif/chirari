plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.robiii7369.chirari'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.robiii7369.chirari'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1-test'
    }

    // Fixed test key, so a new build installs over the old one.
    // Test builds only: a Play Store release must use a private key kept out of this public repo.
    signingConfigs {
        test {
            storeFile file('chirari-test.keystore')
            storePassword 'chirari-test'
            keyAlias 'chirari'
            keyPassword 'chirari-test'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.test
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No extra libraries: the app uses only the Android platform (WebView, TextToSpeech, AppWidget).
