name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Put the web app inside the Android app
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html

      - name: Build the APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk chirari.apk

      - uses: actions/upload-artifact@v4
        with:
          name: chirari-apk
          path: chirari.apk

      - name: Publish the download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Chirari for Android (test version)
          body: |
            Test version of Chirari with a real home-screen widget.
            Download chirari.apk on an Android phone and allow the install when asked.
          files: chirari.apk
          make_latest: true
